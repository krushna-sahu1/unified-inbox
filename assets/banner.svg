<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">unified-inbox</title>
  <desc id="d">Three message streams, WhatsApp, Instagram and LinkedIn, merging into one Hermes inbox with drafts waiting for approval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g font-size="20" font-weight="600" fill="#e2e8f0">
      <rect x="70" y="80" width="230" height="56" rx="14" fill="#14532d"/>
      <text x="185" y="115" text-anchor="middle">WhatsApp</text>
      <rect x="70" y="172" width="230" height="56" rx="14" fill="#701a75"/>
      <text x="185" y="207" text-anchor="middle">Instagram</text>
      <rect x="70" y="264" width="230" height="56" rx="14" fill="#1e3a8a"/>
      <text x="185" y="299" text-anchor="middle">LinkedIn</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="3">
      <path d="M300 108 C 400 108, 420 200, 520 200"/>
      <path d="M300 200 L 520 200"/>
      <path d="M300 292 C 400 292, 420 200, 520 200"/>
    </g>
    <rect x="520" y="120" width="360" height="160" rx="20" fill="#f8fafc"/>
    <text x="700" y="185" text-anchor="middle" font-size="40" font-weight="700" fill="#0f172a">unified-inbox</text>
    <text x="700" y="225" text-anchor="middle" font-size="18" fill="#475569">read · search · triage · draft</text>
    <path d="M880 200 L 960 200" stroke="#64748b" stroke-width="3"/>
    <rect x="960" y="150" width="190" height="100" rx="16" fill="#fbbf24"/>
    <text x="1055" y="193" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">/inbox send</text>
    <text x="1055" y="222" text-anchor="middle" font-size="16" fill="#0f172a">you confirm</text>
  </g>
</svg>
