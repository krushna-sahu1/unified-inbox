</text><text x="240" y="150" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" font-size="13" fill="#C9C9DD">your own key</text><text x="240" y="172" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" font-size="13" fill="#C9C9DD">one call at a time</text><text x="240" y="194" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" font-size="13" fill="#C9C9DD">2-5 s apart</text><text x="240" y="216" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" font-size="13" fill="#C9C9DD">120 calls an hour</text><text x="240" y="238" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" font-size="13" fill="#C9C9DD">webhooks, optional</text><line x1="434" y1="214.0" x2="464" y2="214.0" stroke="#8C8CB0" stroke-width="1.4"/><path d="M464 214.0 L457.1 218.1 M464 214.0 L457.1 209.9" stroke="#8C8CB0" stroke-width="1.4" fill="none" stroke-linecap="round"/><rect x="468" y="96" width="208" height="236" fill="#0E0E1F" stroke="#8C8CB0" stroke-width="1.2"/><text x="482" y="122" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.6" fill="#A6A6C4">#2 LOCAL SQLITE</text><text x="482" y="150" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" font-size="13" fill="#C9C9DD">chats and messages</text><text x="482" y="172" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" font-size="13" fill="#C9C9DD">full-text search</text><text x="482" y="194" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI Mono', Menlo, Consolas, monospace" font-size="13" fill="#C9C9DD">memory, open items</text><text x="482" y="216" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI 